<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word & Char Counter — free by wantedasa.dev</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background:#0d1117; color:#e6edf3; padding:24px; text-align:center; }
  .tag { font-size:.8rem; color:#8b949e; }
  .note { font-size:.8rem; color:#6b7280; max-width:520px; }
  
</style>
</head>
<body>
<textarea id="ta" placeholder="Type here..." style="width:100%;max-width:460px;height:120px;padding:12px;border-radius:10px;border:1px solid #30363d;background:#161b22;color:#e6edf3"></textarea><div class="tag" id="st" style="margin-top:10px">0 chars · 0 words · 0 lines</div>

<script>
var ta=document.getElementById('ta'),st=document.getElementById('st');function u(){var v=ta.value,c=v.length,w=(v.trim()?v.trim().split(/\s+/).length:0),l=v.split(/\n/).length;st.textContent=c+' chars · '+w+' words · '+l+' lines';}ta.addEventListener('input',u);u();
</script>
</body>
</html>
